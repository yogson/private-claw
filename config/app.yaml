# Application runtime configuration
# Environment override prefix: ASSISTANT_APP_
# Special case: logfire_token uses ASSISTANT_LOGFIRE_TOKEN

runtime_mode: prod   # prod | dev
data_root: ./data    # root for all persisted runtime data
timezone: UTC        # IANA timezone string, e.g. Europe/Kyiv
log_level: INFO      # DEBUG | INFO | WARNING | ERROR
logfire_token: ""    # optional; can be set via ASSISTANT_LOGFIRE_TOKEN
confirmation_ttl_seconds: 86400  # validity of Approve/Reject confirmations (default 24h)
capability_history_retention: 50  # manifest versions kept per capability in <config_dir>/.capability_history
capability_edit_max_prompt_parts: 8  # messages a capability edit may use to show a prompt change in full
# instance_name: optional label in logs and "System started (<name>)."; set it per instance
#   via ASSISTANT_APP_INSTANCE_NAME (make up does this), not in a shared config file
# shared_data_root: data shared by all instances (sub-agent worktrees, in_place locks).
#   Empty (default): data_root. make up sets it to <repo>/data for every instance via
#   ASSISTANT_APP_SHARED_DATA_ROOT.
