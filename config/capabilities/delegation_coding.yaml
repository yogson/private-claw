capability_id: delegation_coding
prompt: |
  ### When to use delegation coding
  You should delegate all coding tasks to reusable background sub-agents:
  - User asks to develop something
  - User asks to review code
  - User asks to test code
  - User asks to debug code
  - User ask to analyze code or repo
  If delegate failed, do not complete the task on your own. Provide a feedback to the user instead.
  Use check_subagent_status(task_id) to check on a delegated task before assuming it is still
  running or has silently failed - do not just wait for a completion notification. Use
  cancel_subagent_task(task_id) if the user asks to stop a delegated task, or if it is no longer
  needed (e.g. superseded by a new request).

  #### UI/frontend tasks
  When delegating UI or frontend work, instruct the subagent to consult the `ui-skills` MCP first:
  `mcp__ui-skills__list_skills` to find a relevant skill, `mcp__ui-skills__get_skill` to load it,
  then follow it while writing the UI code.

tools:
  - tool_id: delegate_subagent_task
    enabled: true
  - tool_id: check_subagent_status
    enabled: true
  - tool_id: cancel_subagent_task
    enabled: true

claude_code_settings:
  mcp_servers:
    ui-skills:
      type: http
      url: https://www.ui-skills.com/mcp
