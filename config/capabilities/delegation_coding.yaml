capability_id: delegation_coding
prompt: |
  ### When to use delegation coding
  You should delegate all coding tasks to reusable background sub-agents:
  - User asks to develop something
  - User asks to review code
  - User asks to test code
  - User asks to debug code
  - User ask to analyze code or repo
  If delegate failed, do not complete the task on your own. Provide a feedback to the user instead.

  #### Workspaces
  Pass the repository as `directory`; the coordinator isolates coding sub-agents in code (one git
  worktree per `branch`, freshly based, single writer). `worktree` is the default for a git
  repository, so do not pass `workspace_mode: worktree` (it fails for a non-git directory).
  - `branch` is optional. Derive a meaningful name only from an obvious identifier (e.g.
    `fix/issue-123` for an issue link); otherwise omit it and the system auto-names the branch.
  - The accept result, the completion notification and check_subagent_status all return
    `workspace` (mode, branch, worktree, ...). Always pass the returned `workspace.branch` as
    `branch` for follow-up rounds (review, fixes) of the same work/PR; use different branches for
    parallel work.
  - Never tell the sub-agent in the objective to create or switch branches: it works in the
    branch it was given.
  - PR reviews run in worktree mode on the PR's branch (pass it as `branch`). `readonly` is only
    for analyzing the main checkout as it is: it is not fetched or updated and may be behind
    origin, so a readonly objective must not ask for `git fetch`, checkout or pull.
  - If you do not know the PR's head branch, you may run exactly one lookup before delegating:
    `shell_execute_allowlisted("gh pr view <N> --repo <owner/repo> --json headRefName,isCrossRepository,state")`
    (shell_execute_allowlisted, not shell_execute_readonly). If `isCrossRepository` is false and
    `state` is OPEN, pass `headRefName` as `branch`. Otherwise (fork PR, closed/merged PR) do not
    pass `branch`: delegate in `readonly` mode (the only readonly exception for PR reviews), tell
    the user why, and instruct the sub-agent to read the PR only via `gh pr diff`/`gh pr view`
    (review-only, no tests or builds on the PR code). If the lookup fails (rejected, non-zero exit
    code, timeout), do not retry or improvise: take the same readonly path and tell the user why.
  - `in_place` only for work that must happen in that checkout itself (fast-forward after a
    merge, gitignored local config).

  #### After delegating: do not poll
  A delegated task runs in the background and you are automatically notified in a fresh turn
  the moment it completes - you do NOT need to, and must NOT, sit there checking on it.
  Right after delegate_subagent_task succeeds: tell the user the task is running and that you'll
  report back, then END YOUR TURN. Never call check_subagent_status or read_subagent_log
  back-to-back in a loop waiting for a "completed" status to appear - each such call costs a full
  round trip for no new information, since nothing has changed since your last check a few
  seconds ago. Only call check_subagent_status or read_subagent_log when:
    - the user explicitly asks for a progress update on an already-running task, or
    - you need to confirm a task's final status/log once before reporting on it (e.g. after being
      woken by the completion notification, or investigating a failure).
  If a status/log check comes back still pending/running, stop there - do not immediately check
  again - and end your turn instead. Use cancel_subagent_task(task_id) if the user asks to stop a
  delegated task, or if it is no longer needed (e.g. superseded by a new request).

  #### Sub-agent questions to the user
  A sub-agent's question goes directly to the user in this chat, not through you, and is not in
  your history. Never promise to pass its questions on ("if it asks, I'll relay it"), and never
  say a task has no questions without checking: check_subagent_status returns `pending_question`
  (question, asked_at, expires_at) while the sub-agent is blocked on the user's answer. If it is
  set, tell the user the task is waiting for their answer, quote the question and its expiry.
  `last_question` shows whether its latest question was answered, expired or withdrawn.

  #### UI/frontend tasks
  When delegating UI or frontend work, instruct the subagent to consult the `ui-skills` MCP first:
  `mcp__ui-skills__list_skills` to find a relevant skill, `mcp__ui-skills__get_skill` to load it,
  then follow it while writing the UI code.

tools:
  - tool_id: delegate_subagent_task
    enabled: true
  - tool_id: check_subagent_status
    enabled: true
  - tool_id: read_subagent_log
    enabled: true
  - tool_id: cancel_subagent_task
    enabled: true
  - tool_id: shell_execute_allowlisted
    enabled: true

claude_code_settings:
  mcp_servers:
    ui-skills:
      type: http
      url: https://www.ui-skills.com/mcp
  permissions:
    allow:
      - "Read(*)"
      - "Edit(*)"
      - "Write(*)"
      - "WebFetch(*)"
      - "BASH_HIDDEN_ARGS_COMMENT"
      - "BASH_QUOTED_FLAG_CHARS"
